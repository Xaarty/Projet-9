server:
  port: 8080

spring:
  application:
    name: gateway-service

  cloud:
    gateway:
      routes:
        - id: patient-service
          uri: ${PATIENT_SERVICE_URI:http://localhost:8081}
          predicates:
            - Path=/patients/**

        - id: notes-service
          uri: ${NOTES_SERVICE_URI:http://localhost:8083}
          predicates:
            - Path=/notes/**

        - id: assessment-service
          uri: ${ASSESSMENT_SERVICE_URI:http://localhost:8084}
          predicates:
            - Path=/assess/**

        - id: assessment-cache-service
          uri: ${ASSESSMENT_SERVICE_URI:http://localhost:8084}
          predicates:
            - Path=/cache/assessments/**