<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Connexion</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="auth-page">

  <img th:src="@{/images/logo.png}" alt="MediLabo Solutions" class="brand-logo">

  <div class="auth-card">
    <h1>Connexion</h1>

    <form th:action="@{/login}" method="post" class="auth-form">
      <div class="form-group">
        <label for="username" class="form-label">Nom d'utilisateur</label>
        <input id="username" name="username" type="text" class="input full-width" placeholder="Saisissez votre nom d'utilisateur" required>
      </div>

      <div class="form-group">
        <label for="password" class="form-label">Mot de passe</label>
        <input id="password" name="password" type="password" class="input full-width" placeholder="Saisissez votre mot de passe" required>
      </div>

      <div th:if="${param.error}" class="alert alert-error">
        Nom d'utilisateur ou mot de passe incorrect.
      </div>

      <button type="submit" class="button full-width">Se connecter</button>

      <div th:if="${param.logout}" class="alert alert-success">
        Déconnexion effectuée avec succès.
      </div>
    </form>
  </div>
</div>
</body>
</html>
