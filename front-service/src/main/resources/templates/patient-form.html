<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${formTitle}">Formulaire patient</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

<header class="site-header">
    <div class="header-container">
        <a th:href="@{/patients}" class="brand">
            <img th:src="@{/images/logo.png}" alt="MediLabo Solutions" class="brand-logo">
            <div class="brand-text">
                <span class="brand-title">MediLabo Solutions</span>
            </div>
        </a>

        <nav class="main-nav">
            <a th:href="@{/patients}" class="nav-link">Patients</a>
            <a th:href="@{/patients/add}" class="nav-link">Ajouter un patient</a>

            <form th:action="@{/logout}" method="post" class="logout-form">
                <button type="submit" class="nav-link nav-button">Déconnexion</button>
            </form>
        </nav>
    </div>
</header>

<div class="container">
    <h1 class="page-title" th:text="${formTitle}">Formulaire patient</h1>

    <div class="card">
        <form th:action="@{${formAction}}" th:object="${patient}" method="post" class="patient-form">
            <input type="hidden"
                   th:if="${_csrf != null}"
                   th:name="${_csrf.parameterName}"
                   th:value="${_csrf.token}">
            <input type="hidden" th:field="*{id}">
            <input type="hidden" th:field="*{version}">

            <div class="form-grid">

                <div class="form-group">
                    <label for="firstName" class="form-label">Prénom</label>
                    <input type="text" id="firstName" th:field="*{firstName}" class="input" placeholder="Saisissez le prénom">
                    <div class="error" th:if="${#fields.hasErrors('firstName')}" th:errors="*{firstName}"></div>
                </div>

                <div class="form-group">
                    <label for="lastName" class="form-label">Nom</label>
                    <input type="text" id="lastName" th:field="*{lastName}" class="input" placeholder="Saisissez le nom">
                    <div class="error" th:if="${#fields.hasErrors('lastName')}" th:errors="*{lastName}"></div>
                </div>

                <div class="form-group">
                    <label for="birthDate" class="form-label">Date de naissance</label>
                    <input type="date" id="birthDate" th:field="*{birthDate}" class="input">
                    <div class="error" th:if="${#fields.hasErrors('birthDate')}" th:errors="*{birthDate}"></div>
                </div>

                <div class="form-group">
                    <label for="gender" class="form-label">Sexe</label>
                    <select id="gender" th:field="*{gender}" class="input">
                        <option value="">Sélectionner un sexe</option>
                        <option value="M">Homme</option>
                        <option value="F">Femme</option>
                    </select>
                    <div class="error" th:if="${#fields.hasErrors('gender')}" th:errors="*{gender}"></div>
                </div>

                <div class="form-group form-group-full">
                    <label for="address" class="form-label">Adresse</label>
                    <input type="text" id="address" th:field="*{address}" class="input" placeholder="Saisissez l'adresse">
                </div>

                <div class="form-group form-group-full">
                    <label for="phone" class="form-label">Téléphone</label>
                    <input type="text" id="phone" th:field="*{phone}" class="input" placeholder="Saisissez le numéro de téléphone">
                </div>
            </div>

            <div class="form-actions">
                <button type="submit" class="button">Enregistrer</button>

                <button type="button"
                        class="button button-secondary"
                        onclick="window.location.href='/patients'">
                    Annuler
                </button>
            </div>
        </form>
    </div>
</div>

</body>
</html>
