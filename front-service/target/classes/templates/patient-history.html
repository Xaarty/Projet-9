<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Patient History</title>
  <style>
    body {
        font-family: Arial, sans-serif;
        margin: 40px;
    }

    h1, h2 {
        margin-bottom: 20px;
    }

    .info {
        margin-bottom: 30px;
    }

    .info p {
        margin: 6px 0;
    }

    .note-card {
        border: 1px solid #ccc;
        padding: 12px;
        margin-bottom: 12px;
        border-radius: 4px;
        background: #f9f9f9;
    }

    .note-date {
        color: #666;
        font-size: 0.9em;
    }

    form {
        margin-top: 20px;
        max-width: 600px;
    }

    textarea {
        width: 100%;
        min-height: 100px;
        padding: 10px;
        box-sizing: border-box;
    }

    button, a.button {
        margin-top: 15px;
        padding: 10px 14px;
        border: none;
        border-radius: 4px;
        text-decoration: none;
        cursor: pointer;
    }

    button {
        background-color: #2d6cdf;
        color: white;
    }

    a.button {
        background-color: #999;
        color: white;
        display: inline-block;
    }
  </style>
</head>
<body>
<h1>Patient History</h1>

<div class="info">
  <p><strong>ID:</strong> <span th:text="${patient.id}"></span></p>
  <p><strong>First Name:</strong> <span th:text="${patient.firstName}"></span></p>
  <p><strong>Last Name:</strong> <span th:text="${patient.lastName}"></span></p>
  <p><strong>Birth Date:</strong> <span th:text="${patient.birthDate}"></span></p>
  <p><strong>Gender:</strong> <span th:text="${patient.gender}"></span></p>
</div>

<h2>Notes</h2>

<div th:if="${#lists.isEmpty(notes)}">
  <p>No notes available for this patient.</p>
</div>

<div th:each="noteItem : ${notes}" class="note-card">
  <p th:text="${noteItem.note}"></p>
  <p class="note-date" th:text="${noteItem.createdAt}"></p>
</div>

<h2>Add a note</h2>

<form th:action="@{'/patients/' + ${patient.id} + '/history'}" method="post">
  <textarea name="note" placeholder="Enter a note" required></textarea>
  <br>
  <button type="submit">Add Note</button>
</form>

<br>
<a class="button" th:href="@{/patients}">Back to patients</a>
</body>
</html>
