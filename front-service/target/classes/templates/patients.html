<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Patients</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>

<header class="site-header">
    <div class="header-container">
        <a th:href="@{/patients}" class="brand">
            <img th:src="@{/images/logo.png}" alt="MediLabo Solutions" class="brand-logo">
            <div class="brand-text">
                <span class="brand-title">MediLabo Solutions</span>
            </div>
        </a>

        <nav class="main-nav">
            <a th:href="@{/patients}" class="nav-link">Patients</a>
            <a th:href="@{/patients/add}" class="nav-link">Add Patient</a>

            <form th:action="@{/logout}" method="post" class="logout-form">
                <button type="submit" class="nav-link nav-button">Logout</button>
            </form>
        </nav>
    </div>
</header>

<div class="container">
    <h1 class="page-title">Patient List</h1>

    <div class="card">
        <div class="actions-bar">
            <a class="button" th:href="@{/patients/add}">Add Patient</a>

            <form class="search-form" th:action="@{/patients}" method="get">
                <input class="input" type="text" name="lastName" placeholder="Last name" th:value="${lastName}" required>
                <input class="input" type="text" name="firstName" placeholder="First name" th:value="${firstName}">
                <input type="hidden" name="page" value="0">
                <input type="hidden" name="size" th:value="${pageSize != null ? pageSize : 20}">

                <button type="submit" class="button">Search</button>

                <button type="button"
                        class="button button-secondary"
                        onclick="window.location.href='/patients'">
                    Reset
                </button>
            </form>
        </div>

        <div class="table-wrapper">
            <table>
                <thead>
                <tr>
                    <th>ID</th>
                    <th>First Name</th>
                    <th>Last Name</th>
                    <th>Birth Date</th>
                    <th>Gender</th>
                    <th>Address</th>
                    <th>Phone</th>
                    <th>Action</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="patient : ${patients}">
                    <td class="patient-id" th:text="${patient.id}"></td>
                    <td class="patient-name" th:text="${patient.firstName}"></td>
                    <td class="patient-name" th:text="${patient.lastName}"></td>
                    <td class="patient-muted" th:text="${patient.birthDate}"></td>
                    <td>
                        <span class="gender-badge" th:text="${patient.gender}"></span>
                    </td>
                    <td th:text="${patient.address}"></td>
                    <td th:text="${patient.phone}"></td>
                    <td>
                        <div class="action-group">
                            <a class="link" th:href="@{'/patients/edit/' + ${patient.id}}">Edit</a>
                            <a class="link" th:href="@{'/patients/' + ${patient.id} + '/history'}">History</a>

                            <form class="inline" th:action="@{'/patients/delete/' + ${patient.id}}" method="post">
                                <input type="hidden"
                                       th:if="${_csrf != null}"
                                       th:name="${_csrf.parameterName}"
                                       th:value="${_csrf.token}">
                                <button type="submit"
                                        class="delete-btn"
                                        onclick="return confirm('Are you sure you want to delete this patient?')">
                                    Delete
                                </button>
                            </form>
                        </div>
                    </td>
                </tr>

                <tr th:if="${#lists.isEmpty(patients)}">
                    <td colspan="8" class="empty-message">No patients found.</td>
                </tr>
                </tbody>
            </table>
        </div>

        <div class="pagination-bar" th:if="${currentPage != null}">
            <a class="button button-secondary"
               th:if="${hasPrevious}"
               th:href="@{/patients(page=${currentPage - 1}, size=${pageSize}, lastName=${lastName}, firstName=${firstName})}">
                Previous
            </a>

            <span class="pagination-info">
                Page <span th:text="${currentPage + 1}"></span>
            </span>

            <a class="button button-secondary"
               th:if="${hasNext}"
               th:href="@{/patients(page=${currentPage + 1}, size=${pageSize}, lastName=${lastName}, firstName=${firstName})}">
                Next
            </a>
        </div>
    </div>
</div>
</body>
</html>
