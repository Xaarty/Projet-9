<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Sign in</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="auth-page">

  <img th:src="@{/images/logo.png}" alt="MediLabo Solutions" class="brand-logo">

  <div class="auth-card">
    <h1>Sign in</h1>

    <form th:action="@{/login}" method="post" class="auth-form">
      <div class="form-group">
        <label for="username" class="form-label">Username</label>
        <input id="username" name="username" type="text" class="input full-width" placeholder="Enter your username" required>
      </div>

      <div class="form-group">
        <label for="password" class="form-label">Password</label>
        <input id="password" name="password" type="password" class="input full-width" placeholder="Enter your password" required>
      </div>

      <div th:if="${param.error}" class="alert alert-error">
        Invalid username or password.
      </div>

      <button type="submit" class="button full-width">Sign in</button>

      <div th:if="${param.logout}" class="alert alert-success">
        You have been logged out successfully.
      </div>
    </form>
  </div>
</div>
</body>
</html>
